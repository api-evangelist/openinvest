name: OpenInvest
description: >-
  OpenInvest was a values-based / ESG investing fintech (Y Combinator and a16z backed)
  that let advisors and investors build and manage portfolios aligned to social and
  environmental causes. It was acquired by J.P. Morgan Chase in 2021 and folded into
  J.P. Morgan's wealth-management and Private Bank offerings. Its standalone product and
  any developer surface were discontinued: the openinvest.com domain now resolves to
  J.P. Morgan (www.openinvest.com is a CNAME to privatebank.jpmorgan.com), and no public
  OpenInvest developer portal, documentation, API reference, SDKs, or .well-known
  metadata could be found during enrichment. Retained in the API Evangelist network as an
  acquired-company record with no live API surface.
